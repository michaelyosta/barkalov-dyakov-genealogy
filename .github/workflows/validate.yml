name: Validate Genealogy Registries

on:
  push:
    branches: [ main, "research/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository structural & integrity validator
        run: python3 research/scripts/validate.py
